server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively — Vite fingerprints filenames on build
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache the HTML entry point so the browser always fetches the
    # latest asset manifest after a new deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback — send all unmatched routes to index.html so React
    # Router can handle client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
